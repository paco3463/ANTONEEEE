<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joey McFlowy | Bespoke Tattoo Artistry</title>
    
    <!-- Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ink: #000000;
            --paper: #ffffff;
        }

        /* WordPress Compatibility & Reset */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: var(--paper);
        }

        body {
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Fix for WP Admin Bar and Theme Overrides */
        #wpadminbar { display: none !important; }
        .entry-content { padding: 0 !important; max-width: none !important; }

        .serif { font-family: 'Playfair Display', serif; }

        /* 3D Canvas Container */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Allows scrolling over the canvas */
        }

        /* High-Contrast Hero Styling */
        .hero-content {
            position: relative;
            z-index: 10;
            mix-blend-mode: difference;
            color: white;
            pointer-events: none;
            width: 100%;
            max-width: 100vw;
        }

        /* Responsive Type with Clamp */
        .hero-title {
            font-size: clamp(3.5rem, 15vw, 11rem);
            line-height: 0.85;
        }

        .interactive { pointer-events: auto; }

        .btn-ink {
            background: var(--ink);
            color: var(--paper);
            padding: clamp(1rem, 3vw, 1.5rem) clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            border: 2px solid var(--ink);
            font-size: clamp(0.7rem, 2vw, 0.9rem);
        }

        @media (hover: hover) {
            .btn-ink:hover {
                background: transparent;
                color: var(--ink);
                transform: translateY(-5px);
            }
        }

        .paper-texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.05;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .grid-line {
            position: absolute;
            background: rgba(0,0,0,0.05);
            z-index: -1;
        }

        /* Custom Scrollbar for Luxury Feel */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--paper); }
        ::-webkit-scrollbar-thumb { background: var(--ink); }
    </style>
</head>
<body>
    <div class="paper-texture"></div>

    <!-- Mobile-Optimized Nav -->
    <nav class="fixed top-0 w-full z-[100] px-6 md:px-12 py-6 md:py-8 flex justify-between items-center bg-white/80 backdrop-blur-sm md:bg-transparent md:backdrop-blur-none">
        <div class="text-xl md:text-2xl font-black tracking-tighter uppercase">Joey McFlowy</div>
        <div class="flex items-center space-x-4 md:space-x-12">
            <a href="#work" class="hidden md:block text-[10px] uppercase font-bold tracking-widest">Archive</a>
            <button onclick="handleBooking()" class="text-[10px] font-bold border-2 border-black px-4 py-2 hover:bg-black hover:text-white transition-all uppercase tracking-widest">
                Book Now
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="relative h-screen w-full flex flex-col justify-center items-center overflow-hidden border-b-[12px] border-black bg-white">
        <div id="canvas-container"></div>

        <div class="hero-content text-center px-6">
            <h1 class="serif hero-title italic">
                Pain. <br>
                <span class="not-italic font-black">Permanent.</span>
            </h1>
            <p class="mt-6 md:mt-8 text-[10px] md:text-xl uppercase tracking-[0.3em] md:tracking-[0.5em] font-light max-w-xs md:max-w-2xl mx-auto opacity-80">
                Bespoke Blackwork & Illustrative Violence
            </p>
            
            <div class="mt-12 md:mt-16 flex justify-center interactive">
                <button onclick="handleBooking()" class="btn-ink shadow-xl">
                    Secure a Consultation
                </button>
            </div>
        </div>

        <!-- Aesthetic Lines -->
        <div class="grid-line w-[1px] h-full left-6 md:left-12 top-0"></div>
        <div class="grid-line w-[1px] h-full right-6 md:right-12 top-0"></div>
    </section>

    <!-- Portfolio Section -->
    <section id="work" class="py-20 md:py-32 bg-white px-6">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start mb-16 md:mb-24 gap-8">
                <h2 class="text-6xl md:text-9xl font-black tracking-tighter uppercase leading-none">The <br>Archive</h2>
                <div class="max-w-md">
                    <p class="text-lg md:text-xl leading-relaxed mb-8">Every piece is a singular artifact. No flash. No repeats. Just the flow of ink and skin.</p>
                    <div class="h-1.5 md:h-2 w-full bg-black"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-black border-2 border-black">
                <div class="bg-white aspect-square flex flex-col items-center justify-center p-8 text-center">
                    <div class="w-full h-full border border-black/5 flex items-center justify-center italic opacity-20 text-xs">Full Portfolio via Instagram</div>
                </div>
                <div class="bg-white aspect-square flex flex-col items-center justify-center p-8 text-center">
                    <div class="w-full h-full border border-black/5 flex items-center justify-center italic opacity-20 text-xs">Available Fall 2024</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact CTA -->
    <section id="contact" class="bg-black text-white py-24 md:py-40 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <p class="text-[10px] uppercase tracking-[0.5em] mb-8 opacity-40">Private Sanctuary | Miami, FL</p>
            <h2 class="serif text-5xl md:text-8xl italic mb-12 md:mb-20">Make your mark.</h2>
            <button onclick="handleBooking()" class="w-full md:w-auto bg-white text-black px-12 py-6 text-lg md:text-xl font-black uppercase tracking-widest hover:bg-transparent hover:text-white border-2 border-white transition-all">
                Start My Piece
            </button>
        </div>
    </section>

    <script>
        let scene, camera, renderer, sphere, clock;
        
        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = window.innerWidth < 768 ? 6 : 5; // Pull back slightly on mobile

            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for mobile performance
            container.appendChild(renderer.domElement);

            // Sphere geometry - segments reduced slightly for mobile performance while keeping quality
            const segments = window.innerWidth < 768 ? 48 : 64;
            const geometry = new THREE.IcosahedronGeometry(2, segments);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x000000,
                roughness: 0.05,
                metalness: 0.1
            });
            
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 1.2);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            sphere.geometry.userData = {
                originalPositions: sphere.geometry.attributes.position.array.slice()
            };

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const positions = sphere.geometry.attributes.position.array;
            const originals = sphere.geometry.userData.originalPositions;

            for (let i = 0; i < positions.length; i += 3) {
                const x = originals[i];
                const y = originals[i+1];
                const z = originals[i+2];

                // Dynamic Peaky Deformation
                const noise = Math.sin(x * 1.5 + time * 0.8) * 0.3 + 
                              Math.cos(y * 2.0 + time * 1.0) * 0.2 +
                              Math.sin(z * 1.2 + time * 1.2) * 0.2;

                const ratio = 1 + noise * 0.35;
                
                positions[i] = x * ratio;
                positions[i+1] = y * ratio;
                positions[i+2] = z * ratio;
            }

            sphere.geometry.attributes.position.needsUpdate = true;
            
            sphere.rotation.y += 0.004;
            sphere.rotation.z += 0.002;
            
            // Subtle floating
            sphere.position.y = Math.sin(time * 0.4) * 0.15;
            sphere.position.x = Math.cos(time * 0.3) * 0.15;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.position.z = window.innerWidth < 768 ? 6 : 5;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', onWindowResize);
        
        // Performance guard: Pause animation when tab is inactive
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clock.stop();
            else clock.start();
        });

        window.onload = initThree;

        function handleBooking() {
            const phoneNumber = "3059056382";
            const message = "Greetings Joey, I am interested in collaborating on a bespoke tattoo project. I appreciate your specific artistic direction and would like to formally inquire about your availability and the consultation process. Looking forward to your response.";
            const encodedMessage = encodeURIComponent(message);
            
            // On mobile, this triggers the SMS app instantly
            window.location.href = `sms:+1${phoneNumber}?body=${encodedMessage}`;
        }
    </script>
</body>
</html>
